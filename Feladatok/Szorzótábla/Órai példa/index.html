<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 5;
        console.log(a);
        document.write(a);

        if (a == 5) {
            document.write("<br>");
            document.write("Hello");
        }

        document.write("<br>");
        for (i=1; i<10; i++) {
            document.write(i+"<br>");
        }

        document.write("<ul>");
        for (i=1; i<10; i++) {
            document.write("<li>"+i+"</li>");
        }
        document.write("</ul>");
        
        function osszeadas(a,b) {
            return a+b;
        }
        document.write(osszeadas(3,4));
        document.write(osszeadas("Hello"," világ!"));

        document.write("<table>");
            for (i=1; i<10; i++) {
                document.write("<tr>");
                    for (j=1; j<10; j++) {
                        document.write("<td>");
                        document.write(osszeadas(i,j));
                        document.write("</td>");
                    }
                document.write("</tr>");
            }
        document.write("</table>");
    </script>
</body>
</html>
